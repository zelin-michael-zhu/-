<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApplyPilot Sample Application Form</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; background: #f7f8fa; color: #111827; padding: 40px; }
      form { max-width: 720px; margin: auto; background: white; border: 1px solid #e5e7eb; border-radius: 20px; padding: 28px; box-shadow: 0 16px 50px rgba(15,23,42,.08); }
      label { display:block; margin: 14px 0 6px; color:#374151; font-size:14px; }
      input { width: 100%; padding: 12px 14px; border:1px solid #d1d5db; border-radius: 12px; }
      button { margin-top: 18px; padding: 12px 16px; border:0; border-radius: 12px; background:#4f46e5; color:white; font-weight:700; }
      button:disabled { background:#c7c7d4; }
    </style>
  </head>
  <body>
    <form>
      <h1>Sample Graduate Application Form</h1>
      <p>Local demo only. Final submission is disabled.</p>
      <label>First name<input name="first_name" /></label>
      <label>Last name<input name="last_name" /></label>
      <label>Email<input name="email" type="email" /></label>
      <label>Nationality<input name="nationality" /></label>
      <label>University<input name="university" /></label>
      <label>Major<input name="major" /></label>
      <label>GPA<input name="gpa" /></label>
      <label>Upload CV<input name="upload_cv" type="file" /></label>
      <button type="button" id="save">Save Draft</button>
      <button type="submit" disabled>Submit Disabled in MVP</button>
    </form>
  </body>
</html>
